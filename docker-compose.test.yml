# Docker Compose Test Environment
# Spins up App, Database, and Toxiproxy in isolated environment
# Designed for real-world resiliency and load testing

version: '3.8'

services:
  # PostgreSQL Database for testing
  test-db:
    image: postgres:15-alpine
    container_name: preet_english_test_db
    environment:
      POSTGRES_DB: preet_english_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password_123
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      - test_db_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d preet_english_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network
    restart: unless-stopped

  # Redis for session storage and caching
  test-redis:
    image: redis:7-alpine
    container_name: preet_english_test_redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --requirepass test_redis_password
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - test-network
    restart: unless-stopped

  # PREET_ENGLISH Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        NODE_ENV: test
    container_name: preet_english_test_app
    environment:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://test_user:test_password_123@toxiproxy:8475/preet_english_test?sslmode=disable
      REDIS_URL: redis://:test_redis_password@test-redis:6379
      SESSION_SECRET: test_session_secret_for_load_testing_only
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test-key}
      TEST_LOAD_PATTERN: "true"
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./test-results:/app/test-results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - test-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Toxiproxy for chaos engineering
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.5.0
    container_name: preet_english_toxiproxy
    ports:
      - "8474:8474"  # API port
      - "8475:8475"  # Proxy port
    command: ["-host=0.0.0.0", "-port=8474"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8474/version"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - test-network
    restart: unless-stopped

  # K6 Load Testing Service
  k6:
    image: grafana/k6:latest
    container_name: preet_english_k6
    environment:
      BASE_URL: http://app:5000
    volumes:
      - ./tests/load:/scripts
      - ./test-results:/results
    command: ["sleep", "infinity"]  # Keep container running for manual test execution
    depends_on:
      app:
        condition: service_healthy
    networks:
      - test-network
    profiles:
      - load-test

  # Monitoring and Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: preet_english_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - test-network
    profiles:
      - monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: preet_english_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: test_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - test-network
    profiles:
      - monitoring

  # Test Results Collector
  test-collector:
    build:
      context: .
      dockerfile: Dockerfile.test-collector
    container_name: preet_english_test_collector
    environment:
      RESULTS_DIR: /results
      REPORT_FORMAT: json,html,csv
    volumes:
      - ./test-results:/results
      - ./scripts:/scripts
    command: ["node", "/scripts/test-results-collector.js"]
    depends_on:
      - app
    networks:
      - test-network
    profiles:
      - collector

volumes:
  test_db_data:
    driver: local
  test_redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Health check and initialization scripts
x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s