# Docker Compose for PREET ENGLISH Development
# Week 1 - Foundation & Infrastructure

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: preet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-preet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preet_password}
      POSTGRES_DB: ${POSTGRES_DB:-preet_english}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-preet_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - preet_network

  # Redis Cache (for future caching implementation)
  redis:
    image: redis:7-alpine
    container_name: preet_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-preet_redis_pass}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - preet_network

  # Application (optional - for full Docker deployment)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: preet_app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-preet_user}:${POSTGRES_PASSWORD:-preet_password}@postgres:5432/${POSTGRES_DB:-preet_english}
      REDIS_URL: redis://:${REDIS_PASSWORD:-preet_redis_pass}@redis:6379
      PORT: 5000
    ports:
      - "${APP_PORT:-5000}:5000"
      - "${VITE_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - preet_network
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  preet_network:
    driver: bridge
